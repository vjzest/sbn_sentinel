version: '3.8'

services:
  sentinel-backend:
    build: .
    container_name: sentinel-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./sbn_sentinel.db:/app/sbn_sentinel.db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3

# Future enhancements defined in SES-010:
# - Database service (PostgreSQL)
# - Redis service (for async queues / caching)
# - Reverse proxy (Nginx/Traefik)
