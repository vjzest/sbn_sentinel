[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
pythonpath = src/runtime

# SES-011: Strict testing settings
# Fail if tests are marked incorrectly
strict_markers = true

# Define environments (unit, integration)
markers =
    unit: marks tests as unit tests (fast, isolated)
    integration: marks tests as integration tests (slower, requires DB/services)
    governance: marks tests as governance compliance tests

# Disable warnings from 3rd party libs crowding test output
filterwarnings =
    ignore::DeprecationWarning
